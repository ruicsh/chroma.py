[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "chroma"
dynamic = ["version"]
description = "Deterministic Semantic Theme Generation for Enterprise Frontends"
requires-python = ">=3.10"
authors = [
    { name = "Rui Costa" }
]
license = { text = "MIT" }
readme = "README.md"
dependencies = []

[project.scripts]
chroma = "chroma.cli:main"

[dependency-groups]
dev = [
    "ruff==0.15.16",
    "pyright==1.1.410",
]

[tool.hatch.version]
path = "chroma/__init__.py"

[tool.pyright]
typeCheckingMode = "standard"
reportMissingTypeStubs = false
reportUnusedVariable = "error"